<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 112 280 280" fill="none">
  <defs>
    <!-- Gradient matching the site's primary and secondary green theme -->
    <linearGradient id="toothGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" /> <!-- Green-500 -->
      <stop offset="50%" stop-color="#16a34a" /> <!-- Green-600 -->
      <stop offset="100%" stop-color="#15803d" /> <!-- Green-700 (primary) -->
    </linearGradient>
    
    <!-- Neon drop shadow glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Smile / Under-arch -->
  <path 
    d="M 120 310 Q 250 400 380 310" 
    stroke="url(#toothGradient)" 
    stroke-width="16" 
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- Tooth Outline -->
  <path 
    d="M 250 185 
       C 220 175 170 150 165 210 
       C 160 260 185 310 205 330 
       C 220 345 235 320 250 305 
       C 265 320 280 345 295 330 
       C 315 310 340 260 335 210 
       C 330 150 280 175 250 185 Z"
    stroke="url(#toothGradient)" 
    stroke-width="18" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Leaf shape in center -->
  <path 
    d="M 250 290 
       C 215 270 215 220 250 200
       C 285 220 285 270 250 290 Z" 
    stroke="url(#toothGradient)" 
    stroke-width="12" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />
  
  <!-- Leaf Vein/Stem -->
  <path 
    d="M 250 290 
       C 250 255 255 240 270 225" 
    stroke="url(#toothGradient)" 
    stroke-width="8" 
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />
</svg>
